name: Terraform DAG Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - stg
        - prd
      region:
        description: 'AWS region'
        required: true
        default: 'us-east-1'
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options:
        - plan
        - apply
        - destroy
  push:
    branches: [main]
    paths:
    - '00-governance/**'
    - '01-core/**'
    - '02-services/**'
    - '03-applications/**'

env:
  TF_VERSION: 1.6.0
  AWS_REGION: ${{ github.event.inputs.region || 'us-east-1' }}
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  # Level 0: Governance
  governance-providers:
    runs-on: ubuntu-latest
    outputs:
      providers-status: ${{ steps.terraform.outcome }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Terraform Init
      working-directory: 00-governance/providers
      run: terraform init
    - name: Terraform Plan/Apply
      id: terraform
      working-directory: 00-governance/providers
      run: |
        if [ -f "environments/${{ env.ENVIRONMENT }}.tfvars" ]; then
          TFVARS_FILE="environments/${{ env.ENVIRONMENT }}.tfvars"
        else
          TFVARS_FILE="settings.auto.tfvars"
        fi
        
        terraform ${{ github.event.inputs.action || 'plan' }} \
          -var="environment=${{ env.ENVIRONMENT }}" \
          -var="region=${{ env.AWS_REGION }}" \
          -var-file="$TFVARS_FILE" \
          ${{ github.event.inputs.action == 'apply' && '-auto-approve' || '' }}

  governance-iam:
    runs-on: ubuntu-latest
    needs: governance-providers
    if: needs.governance-providers.outputs.providers-status == 'success'
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Terraform Operations
      working-directory: 00-governance/iam
      run: |
        terraform init
        if [ -f "environments/${{ env.ENVIRONMENT }}.tfvars" ]; then
          TFVARS_FILE="environments/${{ env.ENVIRONMENT }}.tfvars"
        else
          TFVARS_FILE="settings.auto.tfvars"
        fi
        
        terraform ${{ github.event.inputs.action || 'plan' }} \
          -var="environment=${{ env.ENVIRONMENT }}" \
          -var="region=${{ env.AWS_REGION }}" \
          -var-file="$TFVARS_FILE" \
          ${{ github.event.inputs.action == 'apply' && '-auto-approve' || '' }}

  governance-organization:
    runs-on: ubuntu-latest
    needs: governance-providers
    if: needs.governance-providers.outputs.providers-status == 'success'
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Terraform Operations
      working-directory: 00-governance/organization
      run: |
        terraform init
        if [ -f "environments/${{ env.ENVIRONMENT }}.tfvars" ]; then
          TFVARS_FILE="environments/${{ env.ENVIRONMENT }}.tfvars"
        else
          TFVARS_FILE="settings.auto.tfvars"
        fi
        
        terraform ${{ github.event.inputs.action || 'plan' }} \
          -var="environment=${{ env.ENVIRONMENT }}" \
          -var="region=${{ env.AWS_REGION }}" \
          -var-file="$TFVARS_FILE" \
          ${{ github.event.inputs.action == 'apply' && '-auto-approve' || '' }}

  # Level 1: Core Infrastructure
  core-networking:
    runs-on: ubuntu-latest
    needs: [governance-iam, governance-organization]
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Terraform Operations
      working-directory: 01-core/01-networking
      run: |
        terraform init
        if [ -f "environments/${{ env.ENVIRONMENT }}.tfvars" ]; then
          TFVARS_FILE="environments/${{ env.ENVIRONMENT }}.tfvars"
        else
          TFVARS_FILE="settings.auto.tfvars"
        fi
        
        terraform ${{ github.event.inputs.action || 'plan' }} \
          -var="environment=${{ env.ENVIRONMENT }}" \
          -var="region=${{ env.AWS_REGION }}" \
          -var-file="$TFVARS_FILE" \
          ${{ github.event.inputs.action == 'apply' && '-auto-approve' || '' }}

  core-security:
    runs-on: ubuntu-latest
    needs: core-networking
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Terraform Operations
      working-directory: 01-core/02-security
      run: |
        terraform init
        if [ -f "environments/${{ env.ENVIRONMENT }}.tfvars" ]; then
          TFVARS_FILE="environments/${{ env.ENVIRONMENT }}.tfvars"
        else
          TFVARS_FILE="settings.auto.tfvars"
        fi
        
        terraform ${{ github.event.inputs.action || 'plan' }} \
          -var="environment=${{ env.ENVIRONMENT }}" \
          -var="region=${{ env.AWS_REGION }}" \
          -var-file="$TFVARS_FILE" \
          ${{ github.event.inputs.action == 'apply' && '-auto-approve' || '' }}

  core-routing:
    runs-on: ubuntu-latest
    needs: core-networking
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Terraform Operations
      working-directory: 01-core/03-routing
      run: |
        terraform init
        if [ -f "environments/${{ env.ENVIRONMENT }}.tfvars" ]; then
          TFVARS_FILE="environments/${{ env.ENVIRONMENT }}.tfvars"
        else
          TFVARS_FILE="settings.auto.tfvars"
        fi
        
        terraform ${{ github.event.inputs.action || 'plan' }} \
          -var="environment=${{ env.ENVIRONMENT }}" \
          -var="region=${{ env.AWS_REGION }}" \
          -var-file="$TFVARS_FILE" \
          ${{ github.event.inputs.action == 'apply' && '-auto-approve' || '' }}

  # Level 2: Services (run in parallel)
  services:
    runs-on: ubuntu-latest
    needs: [core-security, core-routing]
    strategy:
      matrix:
        service: [01-databases, 02-caching, 03-messaging, 04-ci-cd]
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Check if service exists
      id: check
      run: |
        if [ -d "02-services/${{ matrix.service }}" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
    - name: Terraform Operations
      if: steps.check.outputs.exists == 'true'
      working-directory: 02-services/${{ matrix.service }}
      run: |
        terraform init
        if [ -f "environments/${{ env.ENVIRONMENT }}.tfvars" ]; then
          TFVARS_FILE="environments/${{ env.ENVIRONMENT }}.tfvars"
        else
          TFVARS_FILE="settings.auto.tfvars"
        fi
        
        terraform ${{ github.event.inputs.action || 'plan' }} \
          -var="environment=${{ env.ENVIRONMENT }}" \
          -var="region=${{ env.AWS_REGION }}" \
          -var-file="$TFVARS_FILE" \
          ${{ github.event.inputs.action == 'apply' && '-auto-approve' || '' }}

  # Level 3: Applications (run in parallel)
  applications:
    runs-on: ubuntu-latest
    needs: services
    strategy:
      matrix:
        app: [app-1, app-2]
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Check if application exists
      id: check
      run: |
        if [ -d "03-applications/${{ matrix.app }}" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
    - name: Terraform Operations
      if: steps.check.outputs.exists == 'true'
      working-directory: 03-applications/${{ matrix.app }}
      run: |
        terraform init
        if [ -f "environments/${{ env.ENVIRONMENT }}.tfvars" ]; then
          TFVARS_FILE="environments/${{ env.ENVIRONMENT }}.tfvars"
        else
          TFVARS_FILE="settings.auto.tfvars"
        fi
        
        terraform ${{ github.event.inputs.action || 'plan' }} \
          -var="environment=${{ env.ENVIRONMENT }}" \
          -var="region=${{ env.AWS_REGION }}" \
          -var-file="$TFVARS_FILE" \
          ${{ github.event.inputs.action == 'apply' && '-auto-approve' || '' }}